# dsh-agent-one bundle patch —— 一体化项目主智能体（preset: one）
#
# 结构：只插入 1 个 preset；不插入 agent-preset-registry（合并 profile 时由 cto 包提供）。
# 主 agent 一个项目一个会话，通过 delegate / send_message 复用 pm/cto/dev 子智能体。
# persona 与 2 个 Skill 由 `one-assets` 在 preset scope 注册。
#
# 硬约束：权限固定 workspace-write，不在本包切 danger-full-access。
- insert:
    - id: preset-one
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: one
        name: 项目主智能体
        description: 一个项目一个会话；按需复用 pm/cto/dev 子智能体。
        order: 5
        plugins:
          - id: one-assets
            name: dsh-agent-one/assets
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: delegate
              agentPreset: pm
              allowedAgentPresets: [pm, cto, dev-leader, dev-developer, dev-tester]
              maxDepth: 1
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
