name: design-kit

# one 包是 cto 的副本：design-kit 由任务-11 同步进来后自动生效。
# 未同步时跳过设计校验，避免长期红灯把告警变成噪音。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: design-kit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tokens + demo + check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - id: guard
        name: 检查 design-kit 是否存在
        run: |
          if [ -d design-kit ]; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.present == '1'
        name: 基线 token 校验
        run: node design-kit/scripts/validate-tokens.mjs design-kit/tokens/baseline.json
      - if: steps.guard.outputs.present == '1'
        name: 示例实例契约校验
        run: node design-kit/scripts/check.mjs design-kit/examples/demo-page/design
